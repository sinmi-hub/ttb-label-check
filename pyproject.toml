[project]
name = "ttb-label-check"
version = "0.1.0"
description = "Checks alcohol label images against their application details"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
